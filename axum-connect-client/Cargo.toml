[package]
name = "axum-connect-client"
version = "0.5.3"
authors = ["Alec Thilenius <alec@thilenius.com>"]
edition = "2021"
categories = [
  "network-programming",
  "web-programming",
  "web-programming::http-client",
]
description = "Typesafe Connect-Web RPC client"
keywords = ["rpc", "protobuf", "connect", "client"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/AThilenius/axum-connect"

[dependencies]
axum-connect-core = { path = "../axum-connect-core" }
bytes = "1.0"
futures = "0.3.31"
pbjson = "0.7.0"
pbjson-types = "0.7.0"
prost = ">=0.13,<0.14"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync"] }
