[package]
name = "axum-connect-core"
version = "0.5.3"
authors = ["Alec Thilenius <alec@thilenius.com>"]
edition = "2021"
categories = [
  "network-programming",
  "web-programming",
]
description = "Shared protocol types and codec for Connect-Web RPC"
keywords = ["rpc", "protobuf", "connect"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/AThilenius/axum-connect"

[dependencies]
futures = "0.3.31"
pbjson = "0.7.0"
pbjson-types = "0.7.0"
prost = ">=0.13,<0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
